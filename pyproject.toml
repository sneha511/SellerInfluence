[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seller-influence-results"
version = "0.2.0"
description = "Offline reproduction of seller-influence metrics from text-free evaluation records"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.7"]

[project.scripts]
seller-audit = "seller_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
